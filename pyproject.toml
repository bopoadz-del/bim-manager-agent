[project]
name = "mep-judge"
version = "0.1.0"
description = "Standalone MEP clash-resolution service. Judges, resolves and reviews MEP coordination on a clone; the model of record is never written to."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "sqlalchemy>=2.0.36",
  "alembic>=1.14",
  "psycopg[binary]>=3.2",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "python-multipart>=0.0.12",
  "arq>=0.26",
  "redis>=5.2",
  "specklepy>=2.21",
  "ifcopenshell==0.8.5",
  "trimesh>=5.1.0",
  "rtree>=1.3",
  "manifold3d>=3.0",
  "numpy>=1.26",
  "scipy>=1.14",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "pytest-cov>=6.0", "httpx>=0.28", "ruff>=0.8", "mypy>=1.13", "types-PyYAML"]

[tool.setuptools.packages.find]
include = ["app*", "vendor*"]

[tool.ruff]
line-length = 110
target-version = "py312"
exclude = ["vendor", "migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
exclude = "(vendor/|migrations/)"


[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
markers = ["acceptance: end-to-end evidence for ACCEPTANCE.md", "slow: needs the 47MB fixture"]

asyncio_mode = "auto"
